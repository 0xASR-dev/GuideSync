# Infrastructure services for GuideSync (Mailhog + Redis).
# The Flask API, Celery worker/beat, and Vue frontend still run on the host
# (see README) — this file just provides the backing services they talk to.
#
#   docker compose up -d      # start Mailhog + Redis in the background
#   docker compose down       # stop them
#
# Mailhog inbox UI: http://localhost:8025   (SMTP on 1025)
# Redis:            localhost:6379

services:
  mailhog:
    image: mailhog/mailhog:latest
    container_name: guidesync-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP  (the backend sends mail here)
      - "8025:8025"   # Web UI (open this to read captured mail)

  redis:
    image: redis:7-alpine
    container_name: guidesync-redis
    restart: unless-stopped
    ports:
      - "6379:6379"   # cache (DB 0) + Celery broker (DB 1) / results (DB 2)
